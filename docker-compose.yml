name: homegym

services:
  api:
    build: ./api
    volumes:
      - homegym-data:/data
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${HOMEGYM_PORT:-4321}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  homegym-data:
